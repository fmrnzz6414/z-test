<html lang="ja">
<head>

    </style>
</head>
<body class="text-gray-800 flex flex-col h-screen">

<div id="app" class="max-w-md mx-auto bg-white h-full shadow-md flex flex-col relative overflow-hidden w-full">

        <p class="text-sm text-gray-600 mb-8 text-center">

        </p>
        
        <div class="w-full space-y-4">
            <button onclick="startMode('top20')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-200">
                🔥 最重要20問 (記述＋選択)<br><span class="text-xs font-normal opacity-90">絶対に押さえるべき厳選20問</span>

            </button>
            <button onclick="startMode('pdf')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-200">

        </div>
    </div>

    <!-- Question Screen -->
    <div id="question-screen" class="hidden p-5 flex-1 flex flex-col overflow-y-auto pb-24 fade-in">
        <div class="flex justify-between items-center mb-4">
            <span id="q-type-badge" class="px-2 py-1 text-xs font-bold rounded"></span>
            <span id="q-importance-badge" class="px-2 py-1 text-xs font-bold rounded"></span>
        </div>
        
        <h3 id="question-text" class="text-lg font-bold mb-6 leading-relaxed"></h3>

        <!-- Choices Area -->
        <div id="choices-container" class="flex flex-col space-y-3"></div>

        <!-- Descriptive Area -->
        <div id="descriptive-container" class="hidden flex flex-col space-y-3">
            <input type="text" id="desc-input" placeholder="回答を入力 (例: 780)" class="border-2 border-gray-300 rounded-lg p-3 text-lg focus:outline-none focus:border-teal-500 w-full">
            <button onclick="checkDescriptive()" class="bg-teal-600 text-white font-bold py-3 rounded-lg shadow">回答する</button>
        </div>

        <!-- Explanation Area -->
        <div id="explanation-area" class="hidden mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200 fade-in shadow-inner">
            <h4 id="result-title" class="font-bold text-xl mb-2"></h4>
            <p id="explanation-text" class="text-sm mb-4 leading-relaxed"></p>
            <span class="text-xs font-bold text-gray-500 bg-gray-200 px-2 py-1 rounded">出典: <span id="source-text"></span></span>
            
            <button onclick="nextQuestion()" class="mt-5 w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg shadow">次の問題へ ➡</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden p-6 flex-1 flex flex-col justify-center items-center fade-in">
        <h2 class="text-2xl font-bold mb-4 text-teal-800">テスト完了！</h2>
        <div class="text-7xl mb-4" id="score-emoji">🎉</div>
        <p class="text-2xl font-bold mb-2">正答率: <span id="score-text" class="text-teal-600"></span></p>
        <p class="text-sm text-gray-600 mb-8 font-bold" id="detail-text"></p>
        <button onclick="returnToHome(true)" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 px-4 rounded-xl shadow-lg">
            トップメニューに戻る
        </button>
    </div>

    <!-- Footer / Skip & Home Buttons -->
    <div id="footer-controls" class="hidden absolute bottom-0 w-full bg-white border-t border-gray-200 p-3 flex justify-between items-center z-10 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <button onclick="returnToHome(false)" class="text-teal-700 hover:text-teal-900 font-bold py-2 px-4 rounded border border-teal-200 bg-teal-50 flex items-center">

            スキップ ⏭
        </button>
    </div>

</div>

    let currentQuestions = [];
    let currentQIndex = 0;

    let skipped = 0;
    let isAnswered = false;

    // Shuffle Array Function
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function returnToHome(isFinished) {
        if (!isFinished) {
            if (!confirm("テストを中断してホームに戻りますか？\n(ここまでの結果はリセットされます)")) {
                return;
            }
        }
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('footer-controls').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('progress').innerText = "モードを選択してください";
    }

    function startMode(mode) {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('footer-controls').classList.remove('hidden');
        
        let pool = [];
        if (mode === 'top20') {
            // isTop20 == 1 (index 1 in rawData)
            pool = rawData.filter(d => d[1] === 1);
            pool = shuffle(pool);
        } else if (mode === 'desc') {
            // type == 0 (index 0)
            pool = rawData.filter(d => d[0] === 0);
            pool = shuffle(pool).slice(0, 20); // Random 20
        } else if (mode === 'pdf') {
            // type == 1
            pool = rawData.filter(d => d[0] === 1);
            pool = shuffle(pool).slice(0, 20); // Random 20
        }
        
        currentQuestions = pool;
        currentQIndex = 0;
        score = 0;
        skipped = 0;
        showQuestion();
    }

    function showQuestion() {
        isAnswered = false;
        const qData = currentQuestions[currentQIndex];
        const isDesc = qData[0] === 0;
        const isHighImp = qData[2] === 1;

        document.getElementById('progress').innerText = `Q. ${currentQIndex + 1} / ${currentQuestions.length}`;
        
        const typeBadge = document.getElementById('q-type-badge');
        typeBadge.innerText = isDesc ? '📝 記述問題' : '🎯 4択問題';
        typeBadge.className = `px-3 py-1 text-xs font-bold rounded-full ${isDesc ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}`;
        
        const impBadge = document.getElementById('q-importance-badge');
        impBadge.innerText = isHighImp ? '🔥 重要度: 高' : '⭐ 重要度: 低';
        impBadge.className = `px-3 py-1 text-xs font-bold rounded-full ${isHighImp ? 'bg-red-100 text-red-700' : 'bg-gray-200 text-gray-700'}`;
        
        document.getElementById('question-text').innerText = qData[3];
        document.getElementById('explanation-area').classList.add('hidden');
        document.getElementById('skip-btn').classList.remove('hidden');
        document.getElementById('source-text').innerText = SRC[qData[7]];

        const choicesContainer = document.getElementById('choices-container');
        const descContainer = document.getElementById('descriptive-container');

        if (!isDesc) {
            choicesContainer.classList.remove('hidden');
            descContainer.classList.add('hidden');
            choicesContainer.innerHTML = '';
            qData[4].forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 border-2 border-gray-200 rounded-xl bg-white hover:bg-blue-50 focus:bg-blue-100 transition duration-150 font-bold text-gray-700 shadow-sm';
                btn.innerText = choice;
                btn.onclick = () => checkChoice(index, btn);
                choicesContainer.appendChild(btn);
            });
        } else {
            choicesContainer.classList.add('hidden');
            descContainer.classList.remove('hidden');
            const inputField = document.getElementById('desc-input');
            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();
        }
    }

    function checkChoice(selectedIndex, btnElement) {
        if(isAnswered) return;
        isAnswered = true;
        const qData = currentQuestions[currentQIndex];
        const correctIdx = qData[5];
        
        const buttons = document.getElementById('choices-container').children;
        for (let btn of buttons) { btn.disabled = true; }
        document.getElementById('skip-btn').classList.add('hidden');

        let isCorrect = (selectedIndex === correctIdx);
        if (isCorrect) score++;

        btnElement.classList.remove('bg-white', 'hover:bg-blue-50');
        if (isCorrect) {
            btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
            showExplanation(true, "⭕ 正解！");
        } else {
            btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
            buttons[correctIdx].classList.remove('bg-white');
            buttons[correctIdx].classList.add('bg-green-100', 'border-green-500');
            showExplanation(false, "❌ 不正解...");
        }
    }

    function checkDescriptive() {
        if(isAnswered) return;
        
        const qData = currentQuestions[currentQIndex];
        const inputField = document.getElementById('desc-input');
        const userAnswer = inputField.value.trim();
        
        if (!userAnswer) return; // ignore empty

        isAnswered = true;
        inputField.disabled = true;
        document.getElementById('skip-btn').classList.add('hidden');

        // 全角半角スペース除去、小文字化で判定
        const formattedUserAns = userAnswer.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
        let isCorrect = qData[4].some(ans => {
            const formattedAccept = ans.normalize('NFKC').replace(/\s+/g, '').toLowerCase();
            return formattedUserAns.includes(formattedAccept) || formattedAccept.includes(formattedUserAns);
        });
        
        if (isCorrect) {
            score++;
            showExplanation(true, "⭕ 正解！");
        } else {
            showExplanation(false, `❌ 不正解... (模範解答: ${qData[4][0]})`);
        }
    }

    function skipQuestion() {
        if(isAnswered) return;
        isAnswered = true;
        skipped++;
        document.getElementById('skip-btn').classList.add('hidden');
        
        const qData = currentQuestions[currentQIndex];
        if (qData[0] === 1) { // choice
            const buttons = document.getElementById('choices-container').children;
            for (let btn of buttons) { btn.disabled = true; }
            buttons[qData[5]].classList.add('bg-green-100', 'border-green-500');
        } else {
            document.getElementById('desc-input').disabled = true;
        }
        showExplanation(false, "⏭ スキップしました");
    }

    function showExplanation(isCorrect, title) {
        const qData = currentQuestions[currentQIndex];
        const expArea = document.getElementById('explanation-area');
        const resTitle = document.getElementById('result-title');
        
        resTitle.innerText = title;
        if(title.includes("スキップ")) {
            resTitle.className = "font-bold text-xl mb-2 text-gray-600";
        } else {
            resTitle.className = `font-bold text-xl mb-2 ${isCorrect ? 'text-green-600' : 'text-red-600'}`;
        }
        
        document.getElementById('explanation-text').innerText = qData[6];
        expArea.classList.remove('hidden');
        
        // 自動スクロール
        setTimeout(() => {
            expArea.scrollIntoView({ behavior: "smooth", block: "end" });
        }, 100);
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('footer-controls').classList.add('hidden');
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden');
        document.getElementById('progress').innerText = "テスト完了";

        const answered = currentQuestions.length - skipped;
        const rate = answered === 0 ? 0 : Math.round((score / answered) * 100);
        
        document.getElementById('score-text').innerText = `${rate}％`;
        document.getElementById('detail-text').innerHTML = `
            出題数: ${currentQuestions.length}問<br>
            正解: ${score}問 / 回答: ${answered}問<br>
            スキップ: ${skipped}問
        `;
        
        const emoji = document.getElementById('score-emoji');
        if (rate === 100) emoji.innerText = "🏆";
        else if (rate >= 80) emoji.innerText = "👏";
        else if (rate >= 50) emoji.innerText = "👍";
        else emoji.innerText = "💪";
    }
</script>

</body>
</html>
